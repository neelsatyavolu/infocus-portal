# Typecheck, lint, tests and a secret scan on every push and PR. The Cloudflare deploy workflow
# skips type checking to ship faster (next.config.ts) and Next.js builds never lint, so this is the gate.
name: Checks

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # typedRoutes: generate .next/types/routes.d.ts, which next-env.d.ts references.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Free for repositories owned by a personal account; an organization would need GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
