# Deploys the Portal to Cloudflare Workers (wrangler.jsonc) on every push to master.
# The build runs here, from a clean checkout: never deploy from a folder that has .env files,
# because the OpenNext build embeds their values into the Worker bundle.
# Runtime settings live on the Worker (wrangler secret); see AGENTS.md "Deploying".
name: Deploy to Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npx opennextjs-cloudflare build
        env:
          # Skips lint + type checking in the build; checks.yml runs both.
          PORTAL_DEPLOY_BUILD: "1"
          # The env schema needs a URL at build time; nothing connects to it.
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          # Public values that Next.js inlines into the bundle (repository variables, not secrets).
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          MEET_APP_URL: ${{ vars.MEET_APP_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_MEET_APP_URL: ${{ vars.NEXT_PUBLIC_MEET_APP_URL }}
          NEXT_PUBLIC_MEDIA_STORAGE_HINT: ${{ vars.NEXT_PUBLIC_MEDIA_STORAGE_HINT }}
      - name: Refuse to deploy a build with embedded env values
        run: |
          if grep -qE '"[A-Z_0-9]+":' .open-next/cloudflare/next-env.mjs; then
            echo "The build embedded .env values; not deploying."
            exit 1
          fi
      - name: Deploy
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler's local emulation asks for this during deploy; it is never connected to.
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://local:local@localhost:5432/local
